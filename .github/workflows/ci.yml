# Pipeline CI Tiket Kereta.
# Push, pull request, atau tombol "Run workflow" di tab Actions menjalankan dua job bersamaan.
# Job api mengetes Laravel. Job web membangun situs Next.js.
# Keduanya harus hijau. Belum ada langkah deploy (CD).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: Tes API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tiket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql
          coverage: none

      - name: Pasang dependensi Composer
        run: composer install --no-interaction --prefer-dist

      - name: Siapkan .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan PHPUnit
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test

  web:
    name: Cek situs web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pasang dependensi npm
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: npm run build
